[package]
name = "autosynth"
version = "0.2.0"
edition = "2024"

[features]
default = ["hot-reload", "midi"]
# Subsecond hot-patching + dioxus devtools connection.
hot-reload = ["dep:subsecond", "dep:dioxus-devtools"]
# MIDI input via midir.
midi = ["dep:midir"]

[[example]]
name = "simple"
required-features = ["hot-reload"]

[[example]]
name = "maya"
required-features = ["hot-reload"]

[[example]]
name = "into_jfk"
required-features = ["hot-reload"]

[dependencies]
anyhow = "1.0"
cpal = "0.15"
rand = "0.10.0"
subsecond = { version = "0.7", optional = true }
dioxus-devtools = { version = "0.7", optional = true }
midir = { version = "0.10", optional = true }
hound = "3.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
